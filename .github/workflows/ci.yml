name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = what the Streamlit Community Cloud app runs on; 3.12 = the Docker image
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache embedding + reranker models
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/fastembed
            /tmp/fastembed_cache
          key: models-${{ hashFiles('belanjawan/index.py', 'belanjawan/retrieve.py') }}

      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Retrieval eval (fails on regression)
        run: python eval/run_retrieval.py --check

      - name: Publish eval table to the run summary
        if: always()
        run: test -f EVAL.md && cat EVAL.md >> "$GITHUB_STEP_SUMMARY" || true

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pgvector backend tests
        run: pytest -q tests/test_pgstore.py
