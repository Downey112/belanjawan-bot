name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache embedding + reranker models
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/fastembed
            /tmp/fastembed_cache
          key: models-${{ hashFiles('belanjawan/index.py', 'belanjawan/retrieve.py') }}

      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Retrieval eval (fails on regression)
        run: python eval/run_retrieval.py --check

      - name: Publish eval table to the run summary
        if: always()
        run: test -f EVAL.md && cat EVAL.md >> "$GITHUB_STEP_SUMMARY" || true
